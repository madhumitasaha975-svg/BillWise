services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billwise}
      POSTGRES_DB: ${POSTGRES_DB:-billwise}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billwise} -d ${POSTGRES_DB:-billwise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Inside Docker the database host is the service name `db`, not localhost.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-billwise}:${POSTGRES_PASSWORD:-billwise}@db:5432/${POSTGRES_DB:-billwise}
      APP_ENV: development
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
